services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://crdt:crdt@postgres:5432/crdt_editor
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    environment:
      DOLLAR: '$'
      SERVER_HOST: server
      SERVER_PORT: 3000
    ports:
      - '8080:80'
    depends_on:
      - server

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: crdt
      POSTGRES_PASSWORD: crdt
      POSTGRES_DB: crdt_editor
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U crdt -d crdt_editor']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
