services:
  - type: pserv
    name: crdt-editor-server
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: crdt-editor-db
          property: connectionString
      - key: PORT
        value: '3000'

  - type: web
    name: crdt-editor-client
    runtime: docker
    dockerfilePath: ./client/Dockerfile
    dockerContext: .
    plan: starter
    envVars:
      - key: DOLLAR
        value: '$'
      - key: SERVER_HOST
        fromService:
          type: pserv
          name: crdt-editor-server
          property: host
      - key: SERVER_PORT
        fromService:
          type: pserv
          name: crdt-editor-server
          property: port

databases:
  - name: crdt-editor-db
    plan: basic-256mb
    databaseName: crdt_editor
    user: crdt
